<!doctype html>
<html>
<head><meta charset="utf-8"><title>PillarCard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"><style>html,body{margin:0}body{background:var(--surface);color:var(--ink);font-family:var(--font-sans);padding:20px}</style></head>
